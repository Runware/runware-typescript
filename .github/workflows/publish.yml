name: Build & Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token npm exchanges for publish rights (trusted publishing).
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer, which is ahead of the npm
      # bundled with the runner's Node.
      - run: npm install -g npm@latest

      - run: bun install

      - run: bun run lint

      - run: bun run typecheck

      - run: bun test

      - run: bun run build

      - name: Verify generated task-map.ts is up to date
        # `bun run build` regenerates task-map.ts via scripts/generate-types.ts.
        # If the committed file differs from a fresh regen against the pinned
        # schemas version, fail — refusing to ship out-of-sync types.
        run: |
          if [ -n "$(git status --porcelain src/types/task-map.ts)" ]; then
            echo "::error::src/types/task-map.ts is out of sync with the pinned schemas version."
            echo "Run \`bun run scripts/generate-types.ts\` locally and commit the result."
            git diff src/types/task-map.ts | head -80
            exit 1
          fi

      # Authenticates over OIDC via the trusted publisher configured on npm, so
      # no token is involved.
      - run: npm publish --access public
